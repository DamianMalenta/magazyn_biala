<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazyn Główny - Inteligentny Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #111827; color: white; user-select: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col h-screen p-4 gap-4">

    <header class="bg-gray-800 rounded-xl p-4 flex flex-col xl:flex-row justify-between items-center gap-4 shadow-lg shrink-0">
        <h1 class="text-2xl font-black uppercase text-blue-400 whitespace-nowrap">Magazyn Główny</h1>
        
        <div class="flex flex-col sm:flex-row gap-2 w-full xl:w-auto">
            <select id="new-item-category" class="bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-lg font-bold outline-none focus:border-blue-500">
                <option value="LODÓWKA">LODÓWKA</option>
                <option value="ZAMRAŻARKA">ZAMRAŻARKA</option>
                <option value="OPAKOWANIA" selected>OPAKOWANIA</option>
            </select>
            
            <input type="text" id="new-item-name" placeholder="Nazwa nowego towaru..." 
                   class="flex-1 sm:w-64 bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-lg font-bold outline-none focus:border-blue-500">
                   
            <select id="new-item-unit" class="bg-gray-900 border border-gray-600 rounded-lg px-3 py-3 text-lg font-bold outline-none focus:border-blue-500 w-24">
                <option value="szt">szt</option>
                <option value="kg">kg</option>
                <option value="op">op</option>
                <option value="worek">worek</option>
            </select>
            
            <button onclick="addNewItem()" 
                    class="bg-blue-600 hover:bg-blue-500 text-white font-black uppercase px-6 py-3 rounded-lg transition active:scale-95">
                Dodaj Nowy
            </button>
        </div>
    </header>

    <div class="flex flex-col lg:flex-row gap-4 flex-1 overflow-hidden">
        
        <aside class="w-full lg:w-1/3 xl:w-1/4 bg-gray-800 rounded-xl p-4 flex flex-col shadow-lg shrink-0 overflow-y-auto hide-scrollbar">
            <h2 class="text-xl font-black uppercase text-green-400 mb-2">Wklej z Messengera</h2>
            <p class="text-xs text-gray-400 mb-4">Wklej całą wiadomość. System rozpozna strefy, jednostki (kg, op, szt) i aliasy.</p>
            <textarea id="messenger-input" placeholder="Wklej tekst tutaj..." 
                      class="flex-1 w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-sm font-mono outline-none focus:border-green-500 resize-none min-h-[200px]"></textarea>
            <button onclick="parseMessenger()" 
                    class="mt-4 bg-green-600 hover:bg-green-500 text-white font-black uppercase px-6 py-3 rounded-lg transition active:scale-95 w-full">
                Przetwórz Tekst
            </button>
            
            <div id="parse-logs" class="mt-4 text-xs font-mono text-gray-400 flex flex-col gap-1"></div>

            <div id="quarantine-zone" class="hidden mt-4 border-t border-red-500/50 pt-4">
                <h3 class="text-sm font-black uppercase text-red-500 mb-2">Nierozpoznane (Kwarantanna):</h3>
                <div id="quarantine-list" class="flex flex-col gap-2">
                    </div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto hide-scrollbar bg-gray-900 rounded-xl p-4 shadow-inner">
            <div id="inventory-container" class="flex flex-col gap-8 pb-10">
                </div>
        </main>

    </div>

    <script>
        const CATEGORIES = ['LODÓWKA', 'ZAMRAŻARKA', 'OPAKOWANIA'];

        // Słownik domenowy
        const DICTIONARY = {
            ignoreLines: ['magazyn', 'aktualizacja', 'ostatnia'], 
            categories: {
                'LODÓWKA': ['lodówka', 'lodowka', 'chłodnia'],
                'ZAMRAŻARKA': ['zamrażarka', 'zamrazarka', 'zamrażalnik', 'zamrazalnik'],
                'OPAKOWANIA': ['opakowania', 'kartony']
            },
            aliases: {
                'Nugetsy': ['nugetsy', 'nuggets', 'nugersy'],
                'Skrzydełka': ['skrzydełka', 'skrzydelka', 'skrzydła'],
                'Szyszki': ['szyszki', 'szyszka'],
                'Papryka': ['papryka worek', 'papryka'],
                'Polędwiczki surowe': ['poledwiczki surowe worek', 'poledwiczki surowe', 'poledwiczki'],
                'Krewetki': ['krewetek', 'krewetki'],
                'Jogurt grecki': ['jogurt grecki', 'jogurt'],
                'Ser Mozzarella': ['ser mozzarella', 'mozzarella'], // Usunięto czyste "ser", by wymusić precyzję
                'Salami': ['salami zwykle', 'salami zwykłe', 'salami']
            }
        };

        // Zoptymalizowana, płaska lista aliasów posortowana po długości znaków
        // Zapobiega to przejmowaniu długich nazw przez krótkie (np. "ser" nie zablokuje "ser mozzarella")
        const SORTED_ALIASES = [];
        for (const [canonical, aliases] of Object.entries(DICTIONARY.aliases)) {
            aliases.forEach(alias => SORTED_ALIASES.push({ canonical, alias: alias.toLowerCase() }));
        }
        SORTED_ALIASES.sort((a, b) => b.alias.length - a.alias.length);

        // Baza startowa (z jednostkami)
        const defaultInventory = [
            { id: 1, name: "Nugetsy", category: "ZAMRAŻARKA", unit: "op", qty: 0 },
            { id: 2, name: "Skrzydełka", category: "ZAMRAŻARKA", unit: "op", qty: 0 },
            { id: 3, name: "Szyszki", category: "ZAMRAŻARKA", unit: "op", qty: 0 },
            { id: 4, name: "Papryka", category: "ZAMRAŻARKA", unit: "worek", qty: 0 },
            { id: 5, name: "Polędwiczki surowe", category: "ZAMRAŻARKA", unit: "worek", qty: 0 },
            { id: 6, name: "Krewetki", category: "ZAMRAŻARKA", unit: "op", qty: 0 },
            { id: 7, name: "Jogurt grecki", category: "LODÓWKA", unit: "szt", qty: 0 },
            { id: 8, name: "Ser Mozzarella", category: "LODÓWKA", unit: "kg", qty: 0 },
            { id: 9, name: "Salami", category: "LODÓWKA", unit: "szt", qty: 0 },
            { id: 10, name: "Kartony małe", category: "OPAKOWANIA", unit: "op", qty: 0 }
        ];

        // Zmiana klucza na v2, żeby nie kolidowało z Twoimi poprzednimi testami
        let inventory = JSON.parse(localStorage.getItem('magazyn_baza_v2')) || defaultInventory;

        function saveAndRender() {
            localStorage.setItem('magazyn_baza_v2', JSON.stringify(inventory));
            renderList();
        }

        function changeQty(id, amount) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                item.qty += amount;
                if (item.qty < 0) item.qty = 0;
                saveAndRender();
            }
        }

        function deleteItem(id) {
            if(confirm("Usunąć trwale ten towar z systemu?")) {
                inventory = inventory.filter(i => i.id !== id);
                saveAndRender();
            }
        }

        function addNewItem() {
            const nameInput = document.getElementById('new-item-name');
            const categoryInput = document.getElementById('new-item-category');
            const unitInput = document.getElementById('new-item-unit');
            
            const name = nameInput.value.trim();
            const category = categoryInput.value;
            const unit = unitInput.value;

            if (!name) return alert("Wymagana nazwa towaru.");

            inventory.push({
                id: Date.now(),
                name: name,
                category: category,
                unit: unit,
                qty: 0
            });

            nameInput.value = "";
            saveAndRender();
        }

        // ==========================================
        // SILNIK PARSOWANIA
        // ==========================================
        function parseMessenger() {
            const rawText = document.getElementById('messenger-input').value;
            const logsDiv = document.getElementById('parse-logs');
            const quarantineZone = document.getElementById('quarantine-zone');
            const quarantineList = document.getElementById('quarantine-list');
            
            logsDiv.innerHTML = "";
            quarantineList.innerHTML = "";
            quarantineZone.classList.add('hidden');
            
            if (!rawText.trim()) return;

            const lines = rawText.split('\n');
            let updatedCount = 0;
            let unknownItems = [];
            let currentCategory = null; 

            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine) return;
                
                const lineLower = cleanLine.toLowerCase();

                if (DICTIONARY.ignoreLines.some(word => lineLower.includes(word))) {
                    logsDiv.innerHTML += `<div class="text-gray-600">Pominięto meta-dane: ${cleanLine}</div>`;
                    return;
                }

                let foundCategory = null;
                for (const [catName, aliases] of Object.entries(DICTIONARY.categories)) {
                    if (aliases.some(alias => lineLower === alias || lineLower.includes(alias))) {
                        foundCategory = catName;
                        break;
                    }
                }
                if (foundCategory) {
                    currentCategory = foundCategory;
                    logsDiv.innerHTML += `<div class="text-blue-400 font-bold mt-2">-- Ustawiono strefę: ${currentCategory} --</div>`;
                    return;
                }

                let parsedQty = 1; 
                let parsedUnit = ''; 
                let rawItemName = cleanLine;

                // Zaktualizowany Regex: Wyciąga Liczbę (Grupa 1), Jednostkę (Grupa 2) i Nazwę (Grupa 3)
                const match = cleanLine.match(/^(\d+(?:[.,]\d+)?)\s*(x|kg|g|l|ml|op|opakowanie|opakowań|worek|worki|pojemnik|pojemniki|szt(?:uk|uki)?\b)?\s*(.+)$/i);
                
                if (match) {
                    parsedQty = parseFloat(match[1].replace(',', '.'));
                    parsedUnit = match[2] ? match[2].toLowerCase() : '';
                    rawItemName = match[3].trim();
                }

                // Mapowanie nazwy (z użyciem posortowanych aliasów by uniknąć greedy matching)
                let normalizedName = rawItemName;
                for (const obj of SORTED_ALIASES) {
                    if (rawItemName.toLowerCase().includes(obj.alias)) {
                        normalizedName = obj.canonical;
                        break; // Pierwszy (czyli najdłuższy) pasujący ciąg kończy wyszukiwanie
                    }
                }

                const targetItem = inventory.find(i => 
                    i.name.toLowerCase() === normalizedName.toLowerCase() || 
                    i.name.toLowerCase() === rawItemName.toLowerCase()
                );

                if (targetItem) {
                    let warning = "";
                    if (currentCategory && targetItem.category !== currentCategory) {
                        warning = `<span class="text-yellow-500 text-[10px] ml-2">(Przeniesiono do ${targetItem.category})</span>`;
                    }

                    targetItem.qty = parsedQty;
                    // Jeśli regex wyłapał nową jednostkę, a chcielibyśmy ją nadpisywać, można to zrobić tu. 
                    // My polegamy na jednostce bazowej przypisanej przy tworzeniu SKU.
                    
                    updatedCount++;
                    logsDiv.innerHTML += `<div class="text-green-500">✔ ${targetItem.name}: ${parsedQty} ${targetItem.unit || ''} ${warning}</div>`;
                } else {
                    // Towar nie istnieje - kwarantanna
                    unknownItems.push({ 
                        rawName: rawItemName, 
                        qty: parsedQty, 
                        unit: parsedUnit || 'szt', // domyślna jednostka jeśli nie podano
                        suggestedCategory: currentCategory || 'OPAKOWANIA' 
                    });
                }
            });

            if (unknownItems.length > 0) {
                quarantineZone.classList.remove('hidden');
                unknownItems.forEach((item) => {
                    quarantineList.innerHTML += `
                        <div class="bg-red-900/30 border border-red-500 rounded p-2 flex flex-col gap-2">
                            <div class="text-sm text-red-200 font-bold">${item.rawName} <span class="text-white">(${item.qty} ${item.unit})</span></div>
                            <div class="text-[10px] text-gray-400">Sugerowana strefa: ${item.suggestedCategory}</div>
                            <button onclick="resolveUnknown('${item.rawName.replace(/'/g, "\\'")}', '${item.suggestedCategory}', '${item.unit}', this)" 
                                    class="bg-red-600 hover:bg-red-500 text-white text-xs font-black uppercase py-2 px-2 rounded transition">
                                Przypisz i Dodaj do Bazy
                            </button>
                        </div>
                    `;
                });
            }

            if (updatedCount > 0) saveAndRender();
            document.getElementById('messenger-input').value = "";
        }

        function resolveUnknown(name, suggestedCategory, unit, btnElement) {
            const nameInput = document.getElementById('new-item-name');
            const catInput = document.getElementById('new-item-category');
            const unitInput = document.getElementById('new-item-unit');
            
            nameInput.value = name;
            
            for(let i=0; i<catInput.options.length; i++) {
                if(catInput.options[i].value === suggestedCategory) {
                    catInput.selectedIndex = i;
                    break;
                }
            }

            // Próba zmapowania jednostki z regexa do wyboru w formularzu
            const fallbackUnits = { 'worek': 'worek', 'kg': 'kg', 'op': 'op', 'opakowanie': 'op' };
            const matchedUnit = fallbackUnits[unit] || 'szt';
            for(let i=0; i<unitInput.options.length; i++) {
                if(unitInput.options[i].value === matchedUnit) {
                    unitInput.selectedIndex = i;
                    break;
                }
            }
            
            nameInput.focus();
            
            btnElement.parentElement.remove();
            if(document.getElementById('quarantine-list').children.length === 0) {
                document.getElementById('quarantine-zone').classList.add('hidden');
            }
        }

        // ==========================================
        // RENDEROWANIE HTML
        // ==========================================
        function renderList() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = '';

            CATEGORIES.forEach(category => {
                const categoryItems = inventory.filter(i => i.category === category);
                
                let borderColor = 'border-gray-700';
                let textColor = 'text-gray-300';
                
                if(category === 'LODÓWKA') { borderColor = 'border-blue-500/30'; textColor = 'text-blue-300'; }
                if(category === 'ZAMRAŻARKA') { borderColor = 'border-cyan-500/30'; textColor = 'text-cyan-300'; }
                if(category === 'OPAKOWANIA') { borderColor = 'border-orange-500/30'; textColor = 'text-orange-300'; }

                let html = `
                    <section class="border-b-2 ${borderColor} pb-6">
                        <h2 class="text-2xl font-black ${textColor} mb-4 tracking-wider">${category}</h2>
                        ${categoryItems.length === 0 ? '<p class="text-gray-600 font-bold">Brak asortymentu w tej strefie.</p>' : ''}
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                `;

                categoryItems.forEach(item => {
                    const isZero = item.qty === 0;
                    const qtyColor = isZero ? 'text-red-500' : 'text-white';
                    const cardBorder = isZero ? 'border-red-500/50' : 'border-gray-700';
                    const bgHilight = isZero ? 'bg-red-900/10' : 'bg-gray-800';
                    const displayUnit = item.unit || 'szt';

                    html += `
                    <div class="${bgHilight} border ${cardBorder} rounded-xl p-4 flex flex-col justify-between shadow-lg">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-lg font-black uppercase text-gray-200 pr-4">${item.name}</h3>
                            <button onclick="deleteItem(${item.id})" class="text-gray-600 hover:text-red-500 transition px-1" title="Usuń SKU">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                        
                        <div class="flex items-center justify-between bg-gray-900 rounded-lg p-2 border border-gray-700">
                            <button onclick="changeQty(${item.id}, -1)" class="w-12 h-12 bg-red-600 hover:bg-red-500 rounded text-2xl font-black text-white flex items-center justify-center transition active:scale-95 shadow-md">-</button>
                            <div class="flex flex-col items-center justify-center w-24">
                                <span class="text-3xl font-black ${qtyColor} text-center">${item.qty}</span>
                                <span class="text-xs font-bold text-gray-500 uppercase">${displayUnit}</span>
                            </div>
                            <button onclick="changeQty(${item.id}, 1)" class="w-12 h-12 bg-green-600 hover:bg-green-500 rounded text-2xl font-black text-white flex items-center justify-center transition active:scale-95 shadow-md">+</button>
                        </div>
                    </div>`;
                });

                html += `</div></section>`;
                container.innerHTML += html;
            });
        }

        renderList();
    </script>
</body>
</html>
